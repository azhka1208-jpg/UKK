<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1500" height="1080" fill="#F7F9FC"/>
  <text x="40" y="30" font-size="20" font-weight="700" fill="#1E3A5F">ERD — SISTEMA (Sistem Peminjaman Alat)</text>

  <!-- connectors -->
  <g stroke="#8CACD0" stroke-width="1.5" fill="none">
    <path d="M190 215 L190 400"/>
    <path d="M840 100 L1140 100"/>
    <path d="M350 470 L480 470 L480 380 L600 380"/>
    <path d="M1140 180 L1050 180 L1050 330 L900 330"/>
    <path d="M350 560 L480 560 L480 660 L600 660"/>
    <path d="M900 660 L1020 660 L1020 500 L1140 500"/>
    <path d="M1290 235 L1290 410"/>
    <path d="M120 215 L120 800"/>
  </g>
  <g font-size="11" font-weight="700" fill="#385675">
    <text x="198" y="250">1</text><text x="198" y="392">N</text>
    <text x="860" y="92">1</text><text x="1115" y="92">N</text>
    <text x="360" y="462">1</text><text x="588" y="372">N</text>
    <text x="1150" y="172">1</text><text x="888" y="322">N</text>
    <text x="360" y="552">1</text><text x="588" y="652">N</text>
    <text x="908" y="652">1</text><text x="1128" y="492">N</text>
    <text x="1298" y="248">1</text><text x="1298" y="402">N</text>
    <text x="128" y="250">1</text><text x="128" y="792">N</text>
  </g>

  <!-- users -->
  <g>
    <rect x="40" y="40" width="300" height="175" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="40" y="40" width="300" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="40" y="56" width="300" height="12" fill="#1E3A5F"/>
    <text x="52" y="60" font-size="13" font-weight="700" fill="#FFFFFF">users</text>
    <g font-size="11.5" fill="#253247">
      <text x="52" y="90"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="52" y="110"><tspan font-weight="700" fill="#476B91">UK</tspan>  username</text>
      <text x="52" y="130"><tspan font-weight="700" fill="#476B91">UK</tspan>  email</text>
      <text x="52" y="150">role</text>
      <text x="52" y="170">is_active</text>
      <text x="52" y="190">password</text>
    </g>
  </g>

  <!-- categories -->
  <g>
    <rect x="600" y="40" width="240" height="120" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="600" y="40" width="240" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="600" y="56" width="240" height="12" fill="#1E3A5F"/>
    <text x="612" y="60" font-size="13" font-weight="700" fill="#FFFFFF">categories</text>
    <g font-size="11.5" fill="#253247">
      <text x="612" y="90"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="612" y="110"><tspan font-weight="700" fill="#476B91">UK</tspan>  name</text>
      <text x="612" y="130">description</text>
    </g>
  </g>

  <!-- tools -->
  <g>
    <rect x="1140" y="40" width="300" height="195" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="1140" y="40" width="300" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="1140" y="56" width="300" height="12" fill="#1E3A5F"/>
    <text x="1152" y="60" font-size="13" font-weight="700" fill="#FFFFFF">tools</text>
    <g font-size="11.5" fill="#253247">
      <text x="1152" y="90"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="1152" y="110"><tspan font-weight="700" fill="#476B91">UK</tspan>  code</text>
      <text x="1152" y="130"><tspan font-weight="700" fill="#476B91">FK</tspan>  category_id</text>
      <text x="1152" y="150">name</text>
      <text x="1152" y="170">stock_total</text>
      <text x="1152" y="190">stock_available</text>
      <text x="1152" y="210">condition / status</text>
    </g>
  </g>

  <!-- borrowings -->
  <g>
    <rect x="40" y="400" width="310" height="215" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="40" y="400" width="310" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="40" y="416" width="310" height="12" fill="#1E3A5F"/>
    <text x="52" y="420" font-size="13" font-weight="700" fill="#FFFFFF">borrowings</text>
    <g font-size="11.5" fill="#253247">
      <text x="52" y="450"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="52" y="470"><tspan font-weight="700" fill="#476B91">UK</tspan>  code</text>
      <text x="52" y="490"><tspan font-weight="700" fill="#476B91">FK</tspan>  user_id</text>
      <text x="52" y="510"><tspan font-weight="700" fill="#476B91">FK</tspan>  approved_by</text>
      <text x="52" y="530">status</text>
      <text x="52" y="550">borrow_date / due_date</text>
      <text x="52" y="570">purpose / total_items</text>
      <text x="52" y="590">rejection_reason</text>
    </g>
  </g>

  <!-- borrowing_details -->
  <g>
    <rect x="600" y="300" width="300" height="150" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="600" y="300" width="300" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="600" y="316" width="300" height="12" fill="#1E3A5F"/>
    <text x="612" y="320" font-size="13" font-weight="700" fill="#FFFFFF">borrowing_details</text>
    <g font-size="11.5" fill="#253247">
      <text x="612" y="350"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="612" y="370"><tspan font-weight="700" fill="#476B91">FK</tspan>  borrowing_id</text>
      <text x="612" y="390"><tspan font-weight="700" fill="#476B91">FK</tspan>  tool_id</text>
      <text x="612" y="410">quantity</text>
      <text x="612" y="430">note</text>
    </g>
  </g>

  <!-- returns -->
  <g>
    <rect x="600" y="580" width="300" height="185" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="600" y="580" width="300" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="600" y="596" width="300" height="12" fill="#1E3A5F"/>
    <text x="612" y="600" font-size="13" font-weight="700" fill="#FFFFFF">returns</text>
    <g font-size="11.5" fill="#253247">
      <text x="612" y="630"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="612" y="650"><tspan font-weight="700" fill="#476B91">UK</tspan>  code</text>
      <text x="612" y="670"><tspan font-weight="700" fill="#476B91">FK</tspan>  borrowing_id (unik)</text>
      <text x="612" y="690"><tspan font-weight="700" fill="#476B91">FK</tspan>  received_by</text>
      <text x="612" y="710">status / return_date</text>
      <text x="612" y="730">late_days / fine_amount</text>
      <text x="612" y="750">fine_paid / verified_at</text>
    </g>
  </g>

  <!-- return_details -->
  <g>
    <rect x="1140" y="410" width="300" height="165" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="1140" y="410" width="300" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="1140" y="426" width="300" height="12" fill="#1E3A5F"/>
    <text x="1152" y="430" font-size="13" font-weight="700" fill="#FFFFFF">return_details</text>
    <g font-size="11.5" fill="#253247">
      <text x="1152" y="460"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="1152" y="480"><tspan font-weight="700" fill="#476B91">FK</tspan>  return_id</text>
      <text x="1152" y="500"><tspan font-weight="700" fill="#476B91">FK</tspan>  tool_id</text>
      <text x="1152" y="520">quantity</text>
      <text x="1152" y="540">condition</text>
      <text x="1152" y="560">note</text>
    </g>
  </g>

  <!-- activity_logs -->
  <g>
    <rect x="40" y="800" width="300" height="155" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="40" y="800" width="300" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="40" y="816" width="300" height="12" fill="#1E3A5F"/>
    <text x="52" y="820" font-size="13" font-weight="700" fill="#FFFFFF">activity_logs</text>
    <g font-size="11.5" fill="#253247">
      <text x="52" y="850"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="52" y="870"><tspan font-weight="700" fill="#476B91">FK</tspan>  user_id</text>
      <text x="52" y="890">action / description</text>
      <text x="52" y="910">subject_type / subject_id</text>
      <text x="52" y="930">ip_address / created_at</text>
    </g>
  </g>

  <!-- notifications -->
  <g>
    <rect x="1140" y="720" width="300" height="140" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="1140" y="720" width="300" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="1140" y="736" width="300" height="12" fill="#1E3A5F"/>
    <text x="1152" y="740" font-size="13" font-weight="700" fill="#FFFFFF">notifications</text>
    <g font-size="11.5" fill="#253247">
      <text x="1152" y="770"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="1152" y="790"><tspan font-weight="700" fill="#476B91">FK</tspan>  user_id</text>
      <text x="1152" y="810">title / message</text>
      <text x="1152" y="830">type / is_read / url</text>
    </g>
  </g>

  <!-- settings -->
  <g>
    <rect x="1140" y="900" width="300" height="130" rx="6" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="1140" y="900" width="300" height="28" rx="6" fill="#1E3A5F"/>
    <rect x="1140" y="916" width="300" height="12" fill="#1E3A5F"/>
    <text x="1152" y="920" font-size="13" font-weight="700" fill="#FFFFFF">settings</text>
    <g font-size="11.5" fill="#253247">
      <text x="1152" y="950"><tspan font-weight="700" fill="#476B91">PK</tspan>  id</text>
      <text x="1152" y="970"><tspan font-weight="700" fill="#476B91">UK</tspan>  key</text>
      <text x="1152" y="990">value / type / group</text>
      <text x="1152" y="1010">label</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#718096">
    <text x="40" y="1055">PK = Primary Key   UK = Unique   FK = Foreign Key   |   1 : N = one-to-many, 1 : 1 = one-to-one</text>
  </g>
</svg>